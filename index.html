<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Rainy Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #22170f; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #help {
    position: fixed; left: 12px; bottom: 10px; max-width: calc(100vw - 330px);
    font: 12px ui-monospace, Menlo, Consolas, monospace; line-height: 1.5;
    color: rgba(255, 232, 205, .55); background: rgba(0, 0, 0, .25); padding: 6px 10px; border-radius: 6px;
    pointer-events: none; transition: opacity .6s;
  }
  #ctl { position: fixed; right: 14px; bottom: 12px; display: flex; gap: 8px; align-items: center; }
  #ctl button {
    font: 700 17px 'Gaegu', ui-monospace, monospace; color: #ffe2c2; background: rgba(40, 24, 14, .7);
    border: 1px dashed rgba(255, 210, 170, .35); border-radius: 18px; padding: 3px 13px 5px; cursor: pointer;
  }
  #ctl button:hover { background: rgba(70, 40, 22, .8); }
  #ctl button.on { border-style: solid; border-color: rgba(255, 210, 170, .7); }
  #tools { position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); display: flex; gap: 6px; }
  #tools button { font: 700 18px 'Gaegu', ui-monospace, monospace; color: #ffe2c2; background: rgba(40, 24, 14, .75);
    border: 1px dashed rgba(255, 210, 170, .35); border-radius: 18px; padding: 3px 14px 5px; cursor: pointer; transition: transform .12s; }
  #tools button small { opacity: .5; font-size: 13px; }
  #tools button.on { background: rgba(230, 160, 100, .35); border: 1px solid rgba(255, 220, 180, .8); transform: translateY(-2px); }
  @media (max-width: 700px) { #tools { bottom: 60px; } }
  #vol { width: 70px; accent-color: #e7a46a; }
  #vol[hidden] { display: none; }
  #toast {
    position: fixed; left: 50%; top: 16px; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
    font: 700 20px 'Gaegu', ui-monospace, monospace; color: #fff3e3; background: rgba(60, 34, 18, .85);
    padding: 4px 16px 6px; border-radius: 20px; transition: opacity .4s, transform .4s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 700px) { #help { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help">drag on the window with the finger, sponge or squeegee · tap the cat · tap the mug: sip · r: rain · m: sound · l: lofi · c: clock · space: pause</div>
<div id="tools">
  <button data-tool="finger" class="on">finger <small>1</small></button>
  <button data-tool="sponge">sponge <small>2</small></button>
  <button data-tool="squeegee">squeegee <small>3</small></button>
</div>
<div id="ctl">
  <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" aria-label="music volume" hidden>
  <button id="lofiBtn">♪ lofi</button>
  <button id="rainBtn">rain</button>
  <button id="sndBtn">sound: off</button>
</div>
<div id="toast"></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---------- saved preferences ----------
  const STORE = 'ascii-cafe-v1';
  const prefs = { sound: false, rain: 1, clock: true, h24: false };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(prefs)); } catch (e) {} };
  const RAIN_NAMES = ['drizzle', 'rain', 'storm'];

  // ---------- helpers ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mixCache = new Map();
  function mix(a, b, t) {
    t = Math.max(0, Math.min(1, Math.round(t * 20) / 20));
    if (t === 0) return a; if (t === 1) return b;
    const k = a + b + t; let v = mixCache.get(k);
    if (!v) {
      const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
      const f = s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t).toString(16).padStart(2, '0');
      v = '#' + f(16) + f(8) + f(0); mixCache.set(k, v);
    }
    return v;
  }

  // ---------- grid ----------
  const FONT_PX = 12;
  let cw, ch, cols, rows, cellCh, cellCol, cellPri;
  function put(gx, gy, c, col, pri) {
    gx |= 0; gy |= 0;
    if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) return;
    const i = gy * cols + gx;
    if (pri > cellPri[i]) { cellPri[i] = pri; cellCh[i] = c; cellCol[i] = col; }
  }
  function putText(s, gx, gy, col, pri) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') put(gx + i, gy, s[i], col, pri); }
  function putArt(lines, gx, gy, colFn, pri) {
    lines.forEach((row, r) => { for (let i = 0; i < row.length; i++) if (row[i] !== ' ') put(gx + i, gy + r, row[i], colFn(row[i], i, r), pri); });
  }

  // ---------- time of day (follows your clock) ----------
  function daylight() {
    const d = new Date(), h = d.getHours() + d.getMinutes() / 60;
    if (h >= 8 && h < 17) return 1;
    if (h >= 6 && h < 8) return (h - 6) / 2;
    if (h >= 17 && h < 19.5) return 1 - (h - 17) / 2.5;
    return 0;
  }
  let day = daylight();

  // ---------- layout ----------
  let foam, foamSeed, W, buildings = [], bokeh = [], fog, lights = [], ix0, ix1, iy0, iy1, mx, my;
  function layout() {
    W = { x0: Math.round(cols * 0.12), x1: Math.round(cols * 0.88), y0: Math.max(6, Math.round(rows * 0.11)), y1: Math.round(rows * 0.8) };
    ix0 = W.x0 + 2; ix1 = W.x1 - 2; iy0 = W.y0 + 1; iy1 = W.y1 - 1;
    mx = Math.round((W.x0 + W.x1) / 2); my = Math.round(W.y0 + (W.y1 - W.y0) * 0.5);
    // the city outside
    buildings = [];
    for (let x = ix0 - 2; x < ix1 + 2;) {
      const w = Math.round(rnd(6, 15)), h = Math.round((iy1 - iy0) * rnd(0.22, 0.62));
      const wins = [];
      for (let yy = iy1 - h + 2; yy < iy1 - 1; yy += 2) for (let xx = x + 1; xx < x + w - 1; xx += 2) wins.push({ x: xx, y: yy, on: Math.random() < 0.45, col: Math.random() < 0.8 ? '#ffd27a' : '#ffb0c8' });
      buildings.push({ x, w, h, wins, tone: Math.random(), antenna: Math.random() < 0.3 });
      x += w + (Math.random() < 0.3 ? 1 : 0);
    }
    // soft blurry lights seen through the wet glass
    bokeh = Array.from({ length: 18 }, () => ({ x: rnd(ix0, ix1) * cw, y: rnd(iy0 + (iy1 - iy0) * 0.35, iy1) * ch, r: rnd(10, 30),
      col: ['255,205,120', '255,150,110', '255,140,180', '140,210,255', '255,230,170'][Math.random() * 5 | 0], ph: Math.random() * 10 }));
    // fog on the glass
    fog = new Float32Array((ix1 - ix0 + 1) * (iy1 - iy0 + 1)).fill(0.6);
    foam = new Float32Array(fog.length); foamSeed = Float32Array.from(fog, () => Math.random());
    // string lights drooping across the top of the wall
    lights = [];
    const hooks = []; for (let x = W.x0 - 3; x <= W.x1 + 3; x += Math.max(14, Math.round((W.x1 - W.x0) / 5))) hooks.push(x);
    for (let k = 0; k < hooks.length - 1; k++) {
      const a = hooks[k], b = hooks[k + 1];
      for (let x = a; x <= b; x++) {
        const t = (x - a) / (b - a), y = 1 + Math.round(Math.sin(t * Math.PI) * Math.min(3, W.y0 - 4));
        lights.push({ x, y, bulb: (x - a) % 4 === 2, ph: Math.random() * 10, col: ['#ffcf6e', '#ff9e7a', '#ffb3cf', '#a9e3ff', '#fff2b0'][(x >> 2) % 5] });
      }
    }
  }
  function resize() {
    const dpr = devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${FONT_PX}px ui-monospace, Menlo, Consolas, monospace`; ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width; ch = FONT_PX;
    cols = Math.ceil(innerWidth / cw); rows = Math.ceil(innerHeight / ch);
    const n = cols * rows; cellCh = new Array(n); cellCol = new Array(n); cellPri = new Float32Array(n);
    layout();
    drops.length = 0; trails.length = 0;
  }

  // ---------- rain on the glass ----------
  const drops = [], trails = [], outside = [];
  const fogCv = document.createElement('canvas'), fogCtx = fogCv.getContext('2d');
  let flash = 0, nextFlash = 600;
  function inGlass(px, py) { return px > ix0 * cw && px < (ix1 + 1) * cw && py > iy0 * ch && py < (iy1 + 1) * ch; }
  function updateRain() {
    const lvl = prefs.rain;
    // new little drops land on the glass
    const spawn = [0.25, 0.7, 1.4][lvl];
    for (let k = 0; k < 3; k++) if (Math.random() < spawn / 3 && drops.length < [70, 150, 230][lvl])
      drops.push({ x: rnd(ix0, ix1 + 1) * cw, y: rnd(iy0, iy1 + 1) * ch, r: rnd(1.2, 3.2), vy: 0, wob: Math.random() * 10 });
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      if (d.vy === 0 && d.r > 3.3 && Math.random() < 0.01) d.vy = 0.3;
      if (d.vy > 0) {
        d.vy = Math.min(2.2, d.vy + 0.03 * d.r / 4);
        d.y += d.vy; d.x += Math.sin(d.y * 0.05 + d.wob) * 0.35;
        d.r = Math.max(2.4, d.r - 0.004);
        if (Math.random() < 0.6) trails.push({ x: d.x, y: d.y - d.r, life: 1 });
        // swallow smaller drops it runs into
        for (let j = drops.length - 1; j >= 0; j--) {
          if (j === i) continue; const e = drops[j];
          if (Math.abs(e.y - d.y) < d.r + e.r && Math.abs(e.x - d.x) < d.r + e.r + 2) { d.r = Math.min(7, Math.sqrt(d.r * d.r + e.r * e.r)); drops.splice(j, 1); if (j < i) i--; }
        }
        if (d.y > (iy1 + 1) * ch) { drops.splice(i, 1); continue; }
      } else if (Math.random() < 0.002) d.r += 0.6;     // still drops slowly grow as rain hits them
    }
    for (let i = trails.length - 1; i >= 0; i--) { trails[i].life -= 0.006; if (trails[i].life <= 0) trails.splice(i, 1); }
    if (trails.length > 900) trails.splice(0, trails.length - 900);
    // rain falling outside
    const out = [3, 8, 15][lvl];
    for (let k = 0; k < out; k++) outside.push({ x: rnd(ix0, ix1) * cw, y: iy0 * ch, vy: rnd(9, 14), vx: lvl === 2 ? 2 : 0.6 });
    for (let i = outside.length - 1; i >= 0; i--) { const o = outside[i]; o.y += o.vy; o.x += o.vx; if (o.y > (iy1 + 1) * ch) outside.splice(i, 1); }
    // lightning in a storm
    flash *= 0.86;
    if (lvl === 2 && --nextFlash <= 0) { flash = 1; nextFlash = rnd(500, 1400); setTimeout(() => sfx.thunder(), rnd(300, 1600)); setTimeout(() => { if (Math.random() < 0.5) flash = 0.7; }, 120); }
    // soap bubbles slowly pop, and some run down the glass
    for (let i = 0; i < foam.length; i++) if (foam[i] > 0) {
      foam[i] -= 0.00045;
      if (foam[i] < 0.2 && Math.random() < 0.002) { foam[i] = 0; if (Math.random() < 0.3) sfx.pop(); }
    }
    // fog slowly comes back
    const target = 0.6 - day * 0.15;
    for (let i = 0; i < fog.length; i++) fog[i] += (target - fog[i]) * 0.0016;
  }
  function wipe(px, py) {
    const R = 2.6;
    const gx = px / cw - ix0, gy = py / ch - iy0, w = ix1 - ix0 + 1, h = iy1 - iy0 + 1;
    for (let y = Math.floor(gy - R); y <= Math.ceil(gy + R); y++) for (let x = Math.floor(gx - R * 1.7); x <= Math.ceil(gx + R * 1.7); x++) {
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const d = Math.hypot((x - gx) / 1.7, y - gy) / R; if (d > 1) continue;
      fog[y * w + x] = Math.min(fog[y * w + x], d * d * 0.5);
    }
    for (let i = drops.length - 1; i >= 0; i--) if (Math.hypot(drops[i].x - px, drops[i].y - py) < R * ch) drops.splice(i, 1);
  }

  // ---------- window cleaning tools ----------
  let tool = 'finger', hover = null;
  const SPONGE = [".------.", "|o O  o|", "|  o O |", "'------'"];
  const SQUEEGEE = ['    ||    ', '    ||    ', '[========]'];
  function forCells(px, py, rx, ry, fn) {     // run fn on glass cells near a point
    const gx = px / cw - ix0, gy = py / ch - iy0, w = ix1 - ix0 + 1, h = iy1 - iy0 + 1;
    for (let y = Math.floor(gy - ry); y <= Math.ceil(gy + ry); y++) for (let x = Math.floor(gx - rx); x <= Math.ceil(gx + rx); x++) {
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const d = Math.hypot((x - gx) / rx, (y - gy) / ry); if (d > 1) continue;
      fn(y * w + x, d, x, y);
    }
  }
  function sponge(px, py) {
    forCells(px, py, 4.5, 2.6, (i, d) => { foam[i] = Math.min(1, foam[i] + (1 - d) * 0.35 + 0.1); fog[i] = Math.min(fog[i], 0.15); });
    for (let k = drops.length - 1; k >= 0; k--) if (Math.hypot(drops[k].x - px, drops[k].y - py) < 3.5 * ch) drops.splice(k, 1);
  }
  let cleaned = 0;
  function squeegee(px, py) {
    // a wide blade: clears everything in a flat strip
    forCells(px, py + ch * 1.2, 5.6, 1.15, (i, d) => { cleaned += foam[i] + fog[i]; if (foam[i] > 0.3 && Math.random() < 0.05) spawnDrip(i); foam[i] = 0; fog[i] = 0; });
    for (let k = drops.length - 1; k >= 0; k--) { const d = drops[k]; if (Math.abs(d.x - px) < 5.8 * cw && Math.abs(d.y - py - ch * 1.2) < ch * 1.4) drops.splice(k, 1); }
    for (let k = trails.length - 1; k >= 0; k--) { const tr = trails[k]; if (Math.abs(tr.x - px) < 5.8 * cw && Math.abs(tr.y - py - ch * 1.2) < ch * 1.4) trails.splice(k, 1); }
  }
  function spawnDrip(i) {      // squeegeed soap runs down in a little drip
    const w = ix1 - ix0 + 1, x = (i % w + ix0 + 0.5) * cw, y = (Math.floor(i / w) + iy0 + 1.5) * ch;
    drops.push({ x, y, r: 3.6, vy: 0.6, wob: Math.random() * 10 });
  }
  function drawTool() {
    if (!hover || !inGlass(hover.x, hover.y) || tool === 'finger') return;
    const gx = Math.floor(hover.x / cw), gy = Math.floor(hover.y / ch);
    if (tool === 'sponge') putArt(SPONGE, gx - 4, gy - 2, c => c === 'o' || c === 'O' ? '#c99a2e' : '#ffd75e', 950);
    else putArt(SQUEEGEE, gx - 5, gy - 1, (c, i, r) => r < 2 ? '#8a5a3a' : c === '=' ? '#5fb3d9' : '#3b7ea3', 950);
  }
  function setTool(t) {
    tool = t;
    document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    toast({ finger: 'finger: wipe the fog', sponge: 'sponge: soap up the window', squeegee: 'squeegee: swipe it all clean' }[t]);
  }
  document.querySelectorAll('#tools button').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

  // ---------- windowsill friends ----------
  const cat = { blink: 0, awake: 0, tail: 0, z: 0 };
  const CAT_SLEEP = ['   /\\___/\\', '  (  -.-  )', '  /   ^   \\___', ' (  |   |  )   )~', '  \\_|___|_/___/'];
  const CAT_AWAKE = ['   /\\___/\\', '  (  o.o  )', '  /   ^   \\___', ' (  |   |  )   )~', '  \\_|___|_/___/'];
  const MUG = ['  .------.', '  |      |]', '  |      |]', '  \\      /', "   `----'"];
  const PLANT = ['  \\ | /', ' \\\\ | //', '  \\\\|//', ' .-----.', ' \\_____/'];
  let sips = 0, steam = [], fills = [];
  function catPos() { return { x: ix1 - 20, y: W.y1 - 4 }; }
  function mugPos() { return { x: ix0 + Math.round((ix1 - ix0) * 0.32), y: W.y1 - 4 }; }
  function plantPos() { return { x: ix0 + 1, y: W.y1 - 4 }; }
  function hitArt(px, py, pos, w, h) { const gx = px / cw, gy = py / ch; return gx >= pos.x && gx <= pos.x + w && gy >= pos.y && gy <= pos.y + h; }
  function updateSill(t) {
    if (cat.awake > 0) cat.awake--;
    if (Math.random() < 0.004) cat.tail = 30;
    if (cat.tail > 0) cat.tail--;
    // steam curls up from the mug
    const m = mugPos();
    if (sips < 6 && Math.random() < 0.18) steam.push({ x: (m.x + 4 + rnd(0, 3)) * cw, y: (m.y - 0.5) * ch, life: 0, max: rnd(50, 90), w: Math.random() * 10 });
    for (let i = steam.length - 1; i >= 0; i--) { const s = steam[i]; s.life++; s.y -= 0.45; s.x += Math.sin(s.life * 0.08 + s.w) * 0.35; if (s.life > s.max) steam.splice(i, 1); }
  }
  function drawSill(t, lamp) {
    const wood = mix('#6b4630', '#ffb070', lamp * 0.12), woodDk = mix('#4a2f20', '#ffb070', lamp * 0.08);
    for (let x = W.x0 - 3; x <= W.x1 + 3; x++) { put(x, W.y1 + 1, '=', wood, 50); put(x, W.y1 + 2, '"', woodDk, 50); }
    // plant
    const p = plantPos();
    putArt(PLANT, p.x, p.y, (c, i, r) => r >= 3 ? '#c46f45' : (c === '|' ? '#5f9f5a' : '#79c06c'), 400);
    // mug of coffee
    const m = mugPos();
    putArt(MUG, m.x, m.y, () => '#efe2d0', 400);
    // the coffee inside: rich brown, with a lighter frothy top that sinks as you drink
    const level = (6 - sips) / 6;                     // 1 = full, 0 = empty
    const inside = [[1, 3, 8], [2, 3, 8], [3, 4, 7]];  // [row, first col, last col] inside the mug
    const topRow = 1 + (1 - level) * 3;
    for (const [r, a, b] of inside) {
      if (level <= 0 || r < Math.floor(topRow)) continue;
      for (let i = a; i <= b; i++) {
        const surface = r === Math.floor(topRow);
        fills.push({ x: m.x + i, y: m.y + r, col: surface ? '#9a6238' : '#4e2c18' });
        put(m.x + i, m.y + r, surface ? (i % 2 ? '~' : '-') : ((i + r) % 3 ? ' ' : '.'), surface ? '#e8c39a' : '#6b3e22', 401);
      }
    }
    for (const s of steam) {
      const a = 1 - s.life / s.max;
      put(Math.floor(s.x / cw), Math.floor(s.y / ch), s.life % 20 < 10 ? '(' : ')', mix('#2a1c14', '#f3e9de', a * 0.7), 380);
    }
    // sleeping cat
    const c = catPos(), art = (cat.awake ? CAT_AWAKE : CAT_SLEEP).slice();
    if (cat.tail > 0) art[3] = art[3].slice(0, -1) + (cat.tail % 10 < 5 ? '~' : '/');
    if (cat.awake > 0 && cat.awake < 40) art[1] = '  (  ^.^  )';
    const breathe = Math.sin(t * 0.0018) > 0.3 && !cat.awake ? 1 : 0;
    if (breathe) art[3] = art[3].replace('  )   )', '  )    )');
    putArt(art, c.x, c.y, (ch2, i, r) => r === 1 && i >= 4 && i <= 8 && 'o-.^'.includes(ch2) ? '#3b2a20' : r === 2 && ch2 === '^' ? '#ff9fb8' : '#f6b374', 410);
    // little z's float up while it sleeps
    if (!cat.awake) {
      const p2 = (t * 0.0004) % 1;
      const zz = ['z', 'z', 'Z'];
      zz.forEach((z, k) => {
        const pp = (p2 + k / 3) % 1;
        put(c.x + 11 + Math.round(pp * 4), c.y - 1 - Math.round(pp * 4), z, mix('#2a1c14', '#ffe8cc', 1 - pp), 420);
      });
    } else if (cat.awake > 60) putText('meow!', c.x + 11, c.y - 2, '#ffe8cc', 420);
  }

  // ---------- string lights ----------
  function drawLights(t) {
    for (const L of lights) {
      if (!L.bulb) { put(L.x, L.y, '~', '#5a4030', 60); continue; }
      const tw = 0.6 + 0.4 * Math.sin(t * 0.002 + L.ph);
      put(L.x, L.y + 1, 'o', mix('#5a4030', L.col, tw), 70);
      put(L.x, L.y, '|', '#5a4030', 60);
    }
  }
  function drawLightGlow(t) {
    for (const L of lights) {
      if (!L.bulb) continue;
      const tw = 0.6 + 0.4 * Math.sin(t * 0.002 + L.ph);
      const x = (L.x + 0.5) * cw, y = (L.y + 1.5) * ch, r = 26;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, L.col + Math.round(tw * 70).toString(16).padStart(2, '0')); g.addColorStop(1, L.col + '00');
      ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2);
    }
  }

  // ---------- clock ----------
  const FONT = {
    '0': ['.###.', '#...#', '#...#', '#...#', '#...#', '#...#', '.###.'], '1': ['..#..', '.##..', '..#..', '..#..', '..#..', '..#..', '.###.'],

    }
    if (hitArt(x, y, m, 11, 5)) {
      if (sips < 6) { sips++; sfx.sip(); for (let k = 0; k < 6; k++) steam.push({ x: (m.x + 4 + rnd(0, 3)) * cw, y: (m.y - 0.5) * ch, life: 0, max: rnd(40, 70), w: Math.random() * 10 }); toast(sips < 6 ? ['mmm… cozy', 'warm and sweet', 'just right', 'one more sip'][Math.random() * 4 | 0] : 'all gone! tap again for a refill'); }
      else { sips = 0; sfx.sip(); toast('fresh coffee, refilled'); }
      return;
    }
    if (inGlass(x, y)) { dragging = true; lastP = { x, y }; useTool(x, y, 0); canvas.setPointerCapture(e.pointerId); }
  });
  canvas.addEventListener('pointermove', e => {
    const x = e.clientX, y = e.clientY;
    hover = { x, y };
    canvas.style.cursor = inGlass(x, y) ? (tool === 'finger' ? 'grab' : 'none') : (hitArt(x, y, catPos(), 17, 5) || hitArt(x, y, mugPos(), 11, 5)) ? 'pointer' : '';
    if (!dragging) return;
    const dist = Math.hypot(x - lastP.x, y - lastP.y), steps = Math.ceil(dist / 5);
    for (let k = 1; k <= steps; k++) useTool(lastP.x + (x - lastP.x) * k / steps, lastP.y + (y - lastP.y) * k / steps, dist, k === steps);
    lastP = { x, y };
  });
  const end = () => { dragging = false; lastP = null; };
  canvas.addEventListener('pointerleave', () => { hover = null; });
  let lastSound = 0;
  function useTool(x, y, speed, withSound = true) {
    if (!inGlass(x, y + (tool === 'squeegee' ? ch : 0))) return;
    if (tool === 'finger') wipe(x, y);
    else if (tool === 'sponge') sponge(x, y);
    else squeegee(x, y);
    const now = performance.now();
    if (!withSound || now - lastSound < (tool === 'squeegee' ? 45 : 70)) return;
    lastSound = now;
    if (tool === 'finger') { if (Math.random() < 0.3) sfx.squeak(); }
    else if (tool === 'sponge') sfx.squish(speed);
    else { sfx.swipe(speed, Math.min(1, cleaned / 6)); cleaned = 0; }
  }
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

  const rainBtn = document.getElementById('rainBtn'), sndBtn = document.getElementById('sndBtn');
  function setRain(l) { prefs.rain = l; save(); rainBtn.textContent = RAIN_NAMES[l]; toast(['a gentle drizzle', 'rainy evening', 'a thunderstorm rolls in'][l]); if (l === 2) nextFlash = 120; }
  rainBtn.textContent = RAIN_NAMES[prefs.rain];
  rainBtn.addEventListener('click', () => setRain((prefs.rain + 1) % 3));
  sndBtn.addEventListener('click', () => { prefs.sound = !prefs.sound; save(); applySound(); });
  applySound();
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r') setRain((prefs.rain + 1) % 3);
    else if (k === 'm') { prefs.sound = !prefs.sound; save(); applySound(); toast(prefs.sound ? 'sound on' : 'sound off'); }
    else if (k === 'l') toggleLofi();
    else if (k === '1') setTool('finger');
    else if (k === '2') setTool('sponge');
    else if (k === '3') setTool('squeegee');
    else if (k === 'c') { prefs.clock = !prefs.clock; save(); }
    else if (k === 'h') { prefs.h24 = !prefs.h24; save(); }
    else if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  });
  setTimeout(() => document.getElementById('help').style.opacity = '0.35', 9000);
})();
</script>
