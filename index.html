<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCII Rainy Café</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #22170f; }
  canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }
  #help {
    position: fixed; left: 12px; bottom: 10px; max-width: calc(100vw - 800px);
    font: 12px ui-monospace, Menlo, Consolas, monospace; line-height: 1.5;
    color: rgba(255, 232, 205, .55); background: rgba(0, 0, 0, .25); padding: 6px 10px; border-radius: 6px;
    pointer-events: none; transition: opacity .6s;
  }
  #ctl { position: fixed; right: 14px; bottom: 12px; display: flex; gap: 8px; align-items: center; }
  #ctl button {
    font: 700 17px 'Gaegu', ui-monospace, monospace; color: #ffe2c2; background: rgba(40, 24, 14, .7);
    border: 1px dashed rgba(255, 210, 170, .35); border-radius: 18px; padding: 3px 13px 5px; cursor: pointer;
  }
  #ctl button:hover { background: rgba(70, 40, 22, .8); }
  #ctl button.on { border-style: solid; border-color: rgba(255, 210, 170, .7); }
  #tools { position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%); display: flex; gap: 6px; }
  #tools button { font: 700 18px 'Gaegu', ui-monospace, monospace; color: #ffe2c2; background: rgba(40, 24, 14, .75);
    border: 1px dashed rgba(255, 210, 170, .35); border-radius: 18px; padding: 3px 14px 5px; cursor: pointer; transition: transform .12s; }
  #tools button small { opacity: .5; font-size: 13px; }
  #tools button.on { background: rgba(230, 160, 100, .35); border: 1px solid rgba(255, 220, 180, .8); transform: translateY(-2px); }
  @media (max-width: 700px) {
    #tools { bottom: 112px; }
    #tools button { font-size: 16px; padding: 2px 11px 4px; }
    #tools button small { display: none; }
    #ctl { right: 8px; left: 8px; bottom: 8px; justify-content: center; gap: 6px; }
    #ctl .seg button { padding: 3px 8px 5px; font-size: 16px; }
    .snd span { min-width: 58px; } #vol { width: 70px; }
  }
  #ctl { flex-wrap: wrap; justify-content: flex-end; max-width: calc(100vw - 28px); }
  #ctl .seg { display: flex; border: 1px dashed rgba(255, 210, 170, .35); border-radius: 18px; overflow: hidden; background: rgba(40, 24, 14, .7); }
  #ctl .seg button { border: 0; border-radius: 0; background: none; padding: 3px 11px 5px; opacity: .7; }
  #ctl .seg button.on { opacity: 1; background: rgba(230, 160, 100, .35); }
  .snd { display: flex; align-items: center; gap: 8px; font: 700 17px 'Gaegu', ui-monospace, monospace; color: #ffe2c2;
    background: rgba(40, 24, 14, .7); border: 1px dashed rgba(255, 210, 170, .35); border-radius: 18px; padding: 3px 12px 5px; }
  .snd span { min-width: 70px; }
  #vol { width: 90px; accent-color: #e7a46a; }
  #toast {
    position: fixed; left: 50%; top: 16px; transform: translate(-50%, -20px); opacity: 0; pointer-events: none;
    font: 700 20px 'Gaegu', ui-monospace, monospace; color: #fff3e3; background: rgba(60, 34, 18, .85);
    padding: 4px 16px 6px; border-radius: 20px; transition: opacity .4s, transform .4s; white-space: nowrap;
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  @media (max-width: 1400px) { #help { display: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="help">drag on the window with the finger, sponge or squeegee · tap the cat · tap the mug: sip · r: rain · m: sound · l: lofi · c: clock · space: pause</div>
<div id="tools">
  <button data-tool="finger" class="on">finger <small>1</small></button>
  <button data-tool="sponge">sponge <small>2</small></button>
  <button data-tool="squeegee">squeegee <small>3</small></button>
</div>
<div id="ctl">
  <div class="seg" id="weather">
    <button data-w="0">drizzle</button><button data-w="1">rain</button><button data-w="2">thunderstorm</button><button data-w="3">snow</button>
  </div>
  <button id="lofiBtn">♪ lofi</button>
  <label class="snd"><span id="sndLbl">sound off</span><input id="vol" type="range" min="0" max="1" step="0.05" value="0" aria-label="sound volume"></label>
</div>
<div id="toast"></div>
<script>
(() => {
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');

  // ---------- saved preferences ----------
  const STORE = 'ascii-cafe-v1';
  const prefs = { volume: 0, rain: 1, clock: true, h24: false };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(STORE) || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem(STORE, JSON.stringify(prefs)); } catch (e) {} };
  const WEATHER = ['drizzle', 'rain', 'thunderstorm', 'snow'];
  if (!(prefs.rain >= 0 && prefs.rain <= 3)) prefs.rain = 1;

  // ---------- helpers ----------
  const rnd = (a, b) => a + Math.random() * (b - a);
  const mixCache = new Map();
  function mix(a, b, t) {
    t = Math.max(0, Math.min(1, Math.round(t * 20) / 20));
    if (t === 0) return a; if (t === 1) return b;
    const k = a + b + t; let v = mixCache.get(k);
    if (!v) {
      const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
      const f = s => Math.round(((A >> s) & 255) + (((B >> s) & 255) - ((A >> s) & 255)) * t).toString(16).padStart(2, '0');
      v = '#' + f(16) + f(8) + f(0); mixCache.set(k, v);
    }
    return v;
  }

  // ---------- grid ----------
  const FONT_PX = 12;
  let cw, ch, cols, rows, cellCh, cellCol, cellPri;
  function put(gx, gy, c, col, pri) {
    gx |= 0; gy |= 0;
    if (gx < 0 || gy < 0 || gx >= cols || gy >= rows) return;
    const i = gy * cols + gx;
    if (pri > cellPri[i]) { cellPri[i] = pri; cellCh[i] = c; cellCol[i] = col; }
  }
  function putText(s, gx, gy, col, pri) { for (let i = 0; i < s.length; i++) if (s[i] !== ' ') put(gx + i, gy, s[i], col, pri); }
  function putArt(lines, gx, gy, colFn, pri) {
    lines.forEach((row, r) => { for (let i = 0; i < row.length; i++) if (row[i] !== ' ') put(gx + i, gy + r, row[i], colFn(row[i], i, r), pri); });
  }

  // ---------- time of day (follows your clock) ----------
  function hourNow() {
    let o = null; try { o = localStorage.getItem('cafe-hour'); } catch (e) {}   // (for testing other times of day)
    if (o !== null && o !== '') return +o;
    const d = new Date(); return d.getHours() + d.getMinutes() / 60;
  }
  function morningness() {
    const h = hourNow();
    if (h >= 5.5 && h < 7) return (h - 5.5) / 1.5;
    if (h >= 7 && h < 9.5) return 1;
    if (h >= 9.5 && h < 11) return 1 - (h - 9.5) / 1.5;
    return 0;
  }
  function daylight() {
    const h = hourNow();
    if (h >= 8 && h < 17) return 1;
    if (h >= 6 && h < 8) return (h - 6) / 2;
    if (h >= 17 && h < 19.5) return 1 - (h - 17) / 2.5;
    return 0;
  }
  let day = daylight(), morning = morningness();

  // ---------- layout ----------
  let foam, foamSeed, W, buildings = [], bokeh = [], fog, lights = [], ix0, ix1, iy0, iy1, mx, my;
  function layout() {
    W = { x0: Math.round(cols * 0.12), x1: Math.round(cols * 0.88), y0: Math.max(6, Math.round(rows * 0.11)), y1: Math.round(rows * 0.8) };
    ix0 = W.x0 + 2; ix1 = W.x1 - 2; iy0 = W.y0 + 1; iy1 = W.y1 - 1;
    mx = Math.round((W.x0 + W.x1) / 2); my = Math.round(W.y0 + (W.y1 - W.y0) * 0.5);
    // the city outside
    buildings = [];
    for (let x = ix0 - 2; x < ix1 + 2;) {
      const w = Math.round(rnd(6, 15)), h = Math.round((iy1 - iy0) * rnd(0.22, 0.62));
      const wins = [];
      for (let yy = iy1 - h + 2; yy < iy1 - 1; yy += 2) for (let xx = x + 1; xx < x + w - 1; xx += 2) wins.push({ x: xx, y: yy, on: Math.random() < 0.45, dayOn: Math.random() < 0.35, col: Math.random() < 0.8 ? '#ffd27a' : '#ffb0c8' });
      buildings.push({ x, w, h, wins, tone: Math.random(), antenna: Math.random() < 0.3 });
      x += w + (Math.random() < 0.3 ? 1 : 0);
    }
    // soft blurry lights seen through the wet glass
    bokeh = Array.from({ length: 18 }, () => ({ x: rnd(ix0, ix1) * cw, y: rnd(iy0 + (iy1 - iy0) * 0.35, iy1) * ch, r: rnd(10, 30),
      col: ['255,205,120', '255,150,110', '255,140,180', '140,210,255', '255,230,170'][Math.random() * 5 | 0], ph: Math.random() * 10 }));
    // fog on the glass
    fog = new Float32Array((ix1 - ix0 + 1) * (iy1 - iy0 + 1)).fill(0.6);
    foam = new Float32Array(fog.length); foamSeed = Float32Array.from(fog, () => Math.random());
    // string lights drooping across the top of the wall
    lights = [];
    const hooks = []; for (let x = W.x0 - 3; x <= W.x1 + 3; x += Math.max(14, Math.round((W.x1 - W.x0) / 5))) hooks.push(x);
    for (let k = 0; k < hooks.length - 1; k++) {
      const a = hooks[k], b = hooks[k + 1];
      for (let x = a; x <= b; x++) {
        const t = (x - a) / (b - a), y = 1 + Math.round(Math.sin(t * Math.PI) * Math.min(3, W.y0 - 4));
        lights.push({ x, y, bulb: (x - a) % 4 === 2, ph: Math.random() * 10, col: ['#ffcf6e', '#ff9e7a', '#ffb3cf', '#a9e3ff', '#fff2b0'][(x >> 2) % 5] });
      }
    }
  }
  function resize() {
    const dpr = devicePixelRatio || 1;
    canvas.width = innerWidth * dpr; canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.font = `${FONT_PX}px ui-monospace, Menlo, Consolas, monospace`; ctx.textBaseline = 'top';
    cw = ctx.measureText('M').width; ch = FONT_PX;
    cols = Math.ceil(innerWidth / cw); rows = Math.ceil(innerHeight / ch);
    const n = cols * rows; cellCh = new Array(n); cellCol = new Array(n); cellPri = new Float32Array(n);
    layout(); placeBirds();
    drops.length = 0; trails.length = 0; cat.x = null;
  }

  // ---------- rain on the glass ----------
  const drops = [], trails = [], outside = [];
  const fogCv = document.createElement('canvas'), fogCtx = fogCv.getContext('2d');
  let flash = 0, nextFlash = 600;
  function inGlass(px, py) { return px > ix0 * cw && px < (ix1 + 1) * cw && py > iy0 * ch && py < (iy1 + 1) * ch; }
  function updateRain() {
    const lvl = prefs.rain, snow = lvl === 3;
    // new little drops (or snowflakes) land on the glass
    const spawn = [0.25, 0.7, 1.4, 0.2][lvl];
    for (let k = 0; k < 3; k++) if (Math.random() < spawn / 3 && drops.length < [70, 150, 230, 55][lvl])
      drops.push({ x: rnd(ix0, ix1 + 1) * cw, y: rnd(iy0, iy1 + 1) * ch, r: rnd(1.2, 3.2), vy: 0, wob: Math.random() * 10, snow, melt: snow ? rnd(300, 700) : 0 });
    for (let i = drops.length - 1; i >= 0; i--) {
      const d = drops[i];
      if (d.snow) { if (--d.melt <= 0) { d.snow = false; d.r = 1.6; } continue; }     // flakes stick, then melt into tiny drops
      if (d.vy === 0 && d.r > 3.3 && Math.random() < 0.01) d.vy = 0.3;
      if (d.vy > 0) {
        d.vy = Math.min(2.2, d.vy + 0.03 * d.r / 4);
        d.y += d.vy; d.x += Math.sin(d.y * 0.05 + d.wob) * 0.35;
        d.r = Math.max(2.4, d.r - 0.004);
        if (Math.random() < 0.6) trails.push({ x: d.x, y: d.y - d.r, life: 1 });
        // swallow smaller drops it runs into
        for (let j = drops.length - 1; j >= 0; j--) {
          if (j === i) continue; const e = drops[j];
          if (Math.abs(e.y - d.y) < d.r + e.r && Math.abs(e.x - d.x) < d.r + e.r + 2) { d.r = Math.min(7, Math.sqrt(d.r * d.r + e.r * e.r)); drops.splice(j, 1); if (j < i) i--; }
        }
        if (d.y > (iy1 + 1) * ch) { drops.splice(i, 1); continue; }
      } else if (Math.random() < 0.002) d.r += 0.6;     // still drops slowly grow as rain hits them
    }
    for (let i = trails.length - 1; i >= 0; i--) { trails[i].life -= 0.006; if (trails[i].life <= 0) trails.splice(i, 1); }
    if (trails.length > 900) trails.splice(0, trails.length - 900);
    // rain falling outside
    const out = [3, 8, 15, Math.random() < 0.45 ? 1 : 0][lvl];
    for (let k = 0; k < out; k++) outside.push(snow ? { x: rnd(ix0, ix1) * cw, y: iy0 * ch, vy: rnd(0.6, 1.4), vx: 0, snow: true, ph: Math.random() * 10 }
                                                     : { x: rnd(ix0, ix1) * cw, y: iy0 * ch, vy: rnd(9, 14), vx: lvl === 2 ? 2 : 0.6 });
    for (let i = outside.length - 1; i >= 0; i--) {
      const o = outside[i]; o.y += o.vy; o.x += o.snow ? Math.sin(o.y * 0.02 + o.ph) * 0.5 : o.vx;
      if (o.y > (iy1 + 1) * ch || (!snow && o.snow) || (snow && !o.snow && Math.random() < 0.2)) outside.splice(i, 1);
    }
    // lightning in a storm
    flash *= 0.86;
    if (lvl === 2 && --nextFlash <= 0) { flash = 1; nextFlash = rnd(500, 1400); setTimeout(() => sfx.thunder(), rnd(300, 1600)); setTimeout(() => { if (Math.random() < 0.5) flash = 0.7; }, 120); }
    // soap bubbles slowly pop, and some run down the glass
    for (let i = 0; i < foam.length; i++) if (foam[i] > 0) {
      foam[i] -= 0.00045;
      if (foam[i] < 0.2 && Math.random() < 0.002) { foam[i] = 0; if (Math.random() < 0.3) sfx.pop(); }
    }
    // fog slowly comes back
    const target = 0.6 - day * 0.15;
    for (let i = 0; i < fog.length; i++) fog[i] += (target - fog[i]) * 0.0016;
  }
  function wipe(px, py) {
    const R = 2.6;
    const gx = px / cw - ix0, gy = py / ch - iy0, w = ix1 - ix0 + 1, h = iy1 - iy0 + 1;
    for (let y = Math.floor(gy - R); y <= Math.ceil(gy + R); y++) for (let x = Math.floor(gx - R * 1.7); x <= Math.ceil(gx + R * 1.7); x++) {
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const d = Math.hypot((x - gx) / 1.7, y - gy) / R; if (d > 1) continue;
      fog[y * w + x] = Math.min(fog[y * w + x], d * d * 0.5);
    }
    for (let i = drops.length - 1; i >= 0; i--) if (Math.hypot(drops[i].x - px, drops[i].y - py) < R * ch) drops.splice(i, 1);
  }

  // ---------- window cleaning tools ----------
  let tool = 'finger', hover = null;
  const SPONGE = [".------.", "|o O  o|", "|  o O |", "'------'"];
  const SQUEEGEE = ['    ||    ', '    ||    ', '[========]'];
  function forCells(px, py, rx, ry, fn) {     // run fn on glass cells near a point
    const gx = px / cw - ix0, gy = py / ch - iy0, w = ix1 - ix0 + 1, h = iy1 - iy0 + 1;
    for (let y = Math.floor(gy - ry); y <= Math.ceil(gy + ry); y++) for (let x = Math.floor(gx - rx); x <= Math.ceil(gx + rx); x++) {
      if (x < 0 || y < 0 || x >= w || y >= h) continue;
      const d = Math.hypot((x - gx) / rx, (y - gy) / ry); if (d > 1) continue;
      fn(y * w + x, d, x, y);
    }
  }
  function sponge(px, py) {
    forCells(px, py, 4.5, 2.6, (i, d) => { foam[i] = Math.min(1, foam[i] + (1 - d) * 0.35 + 0.1); fog[i] = Math.min(fog[i], 0.15); });
    for (let k = drops.length - 1; k >= 0; k--) if (Math.hypot(drops[k].x - px, drops[k].y - py) < 3.5 * ch) drops.splice(k, 1);
  }
  let cleaned = 0;
  function squeegee(px, py) {
    // a wide blade: clears everything in a flat strip
    forCells(px, py + ch * 1.2, 5.6, 1.15, (i, d) => { cleaned += foam[i] + fog[i]; if (foam[i] > 0.3 && Math.random() < 0.05) spawnDrip(i); foam[i] = 0; fog[i] = 0; });
    for (let k = drops.length - 1; k >= 0; k--) { const d = drops[k]; if (Math.abs(d.x - px) < 5.8 * cw && Math.abs(d.y - py - ch * 1.2) < ch * 1.4) drops.splice(k, 1); }
    for (let k = trails.length - 1; k >= 0; k--) { const tr = trails[k]; if (Math.abs(tr.x - px) < 5.8 * cw && Math.abs(tr.y - py - ch * 1.2) < ch * 1.4) trails.splice(k, 1); }
  }
  function spawnDrip(i) {      // squeegeed soap runs down in a little drip
    const w = ix1 - ix0 + 1, x = (i % w + ix0 + 0.5) * cw, y = (Math.floor(i / w) + iy0 + 1.5) * ch;
    drops.push({ x, y, r: 3.6, vy: 0.6, wob: Math.random() * 10 });
  }
  function drawTool() {
    if (!hover || !inGlass(hover.x, hover.y) || tool === 'finger') return;
    const gx = Math.floor(hover.x / cw), gy = Math.floor(hover.y / ch);
    if (tool === 'sponge') putArt(SPONGE, gx - 4, gy - 2, c => c === 'o' || c === 'O' ? '#c99a2e' : '#ffd75e', 950);
    else putArt(SQUEEGEE, gx - 5, gy - 1, (c, i, r) => r < 2 ? '#8a5a3a' : c === '=' ? '#5fb3d9' : '#3b7ea3', 950);
  }
  function setTool(t) {
    tool = t;
    document.querySelectorAll('#tools button').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
    toast({ finger: 'finger: wipe the fog', sponge: 'sponge: soap up the window', squeegee: 'squeegee: swipe it all clean' }[t]);
  }
  document.querySelectorAll('#tools button').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));

  // ---------- birds on a wire (mornings and daytime) ----------
  let birds = [], flying = [], wireY = 0;
  function wireAt(gx) { const t = (gx - ix0) / (ix1 - ix0); return wireY + Math.round(Math.sin(t * Math.PI) * 2); }
  function placeBirds() {
    wireY = iy0 + Math.round((iy1 - iy0) * 0.34);
    birds = [];
    const n = Math.max(3, Math.min(7, Math.round((ix1 - ix0) / 22)));
    for (let k = 0; k < n; k++) birds.push({ x: Math.round(ix0 + (k + 0.5 + rnd(-0.3, 0.3)) / n * (ix1 - ix0)), right: Math.random() < 0.5, bob: Math.random() * 10, gone: 0 });
  }
  function birdsOut() { return (day > 0.25 || morning > 0.2) && prefs.rain !== 2; }
  function drawBirds(t) {
    if (!birdsOut()) return;
    const wire = mix('#2a2630', '#4a4650', day * 0.5);
    for (let x = ix0; x <= ix1; x++) put(x, wireAt(x), '-', wire, 121);
    for (const b of birds) {
      if (b.gone > 0) { b.gone--; continue; }
      const hop = Math.sin(t * 0.003 + b.bob) > 0.97 ? 1 : 0;
      const art = b.right ? "(')>" : "<(')";
      const col = mix('#3a3140', '#5a5060', day * 0.5);
      for (let i = 0; i < 4; i++) put(b.x + i, wireAt(b.x) - 1 - hop, art[i], art[i] === '>' || art[i] === '<' ? '#e8a040' : col, 125);
    }
    for (let i = flying.length - 1; i >= 0; i--) {
      const f = flying[i]; f.t++; f.x += f.vx; f.y += f.vy; f.vy -= 0.01;
      put(Math.floor(f.x / cw), Math.floor(f.y / ch), f.t % 10 < 5 ? 'v' : '^', '#3a3140', 126);
      if (f.y < iy0 * ch) flying.splice(i, 1);
    }
  }
  function birdAt(px, py) {
    if (!birdsOut()) return null;
    const gx = px / cw, gy = py / ch;
    return birds.find(b => !b.gone && gx >= b.x - 1 && gx <= b.x + 5 && Math.abs(gy - (wireAt(b.x) - 1)) < 1.6) || null;
  }
  function shooBird(b) {
    b.gone = Math.round(rnd(900, 1800));
    flying.push({ x: (b.x + 2) * cw, y: (wireAt(b.x) - 1) * ch, vx: (b.right ? 1 : -1) * rnd(1.2, 2), vy: -rnd(1, 1.6), t: 0 });
    sfx.chirp();
  }

  // ---------- windowsill friends ----------
  // the cat has moods: sleep, watch (a raindrop), paw (at it), stretch, walk, awake (you tapped it)
  const cat = { mode: 'sleep', t: 0, x: null, target: 0, dir: 1, tail: 0, drop: null, awake: 0, next: 900 };
  const A = (rows, face) => ({ rows, face });
  const CAT = {
    sleep: A(['   /\\___/\\', '  (  -.-  )', '  /   ^   \\___', ' (  |   |  )   )~', '  \\_|___|_/___/'], 1),
    awake: A(['   /\\___/\\', '  (  o.o  )', '  /   ^   \\___', ' (  |   |  )   )~', '  \\_|___|_/___/'], 1),
    watch: A(['    /\\_/\\', '   ( o.o )', '    > ^ <', '   /|   |\\', '  (_|___|_)~'], 1),
    paw:   A(['    /\\_/\\  ,', '   ( >.< )/', '    > ^ </', '   /|   |', '  (_|___|_)~'], 1),
    stretch: A(['', '              /\\_/\\', '  ___________( -o- )', ' (_____________ ^ /', '  /_/      \\_\\'], 1),
    walk1: A(['', '          /\\_/\\', '  _______( o.o )', ' (_________ ^ /~', '   /_/  \\_\\'], 2),

    for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    const am = morning > 0.4;     // mornings get a brighter, bouncier tune
    const BPM = am ? 84 : 70, beat = 60 / BPM, swing = beat * (am ? 0.12 : 0.17);
    const CH = am ? [[60, 64, 67, 71], [57, 60, 64, 67], [53, 57, 60, 64], [55, 59, 62, 64]]    // Cmaj7 – Am7 – Fmaj7 – G6
                  : [[52, 55, 59, 62], [57, 60, 64, 67], [50, 53, 57, 60], [55, 59, 62, 65]];   // Em7 – Am7 – Dm7 – G7
    const MEL = am ? [76, 79, 81, 84, 86, 84, 81, 79, 88] : [71, 74, 76, 79, 81, 79, 76, 74];
    warm.frequency.value = am ? 3400 : 2400;
    const hz = n => 440 * Math.pow(2, (n - 69) / 12);
    const keys = (n, t, len, v) => { const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), g2 = ac.createGain(), f = ac.createBiquadFilter();
      o.type = 'sine'; o2.type = 'triangle'; o.frequency.value = hz(n); o2.frequency.value = hz(n) * 2.002; g2.gain.value = 0.12;
      f.type = 'lowpass'; f.frequency.setValueAtTime(1700, t); f.frequency.exponentialRampToValueAtTime(550, t + len);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      o.connect(g); o2.connect(g2).connect(g); g.connect(f).connect(m); o.start(t); o2.start(t); o.stop(t + len + 0.05); o2.stop(t + len + 0.05); };
    const kick = t => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.setValueAtTime(115, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.18);
      g.gain.setValueAtTime(0.5, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.35); o.connect(g).connect(m); o.start(t); o.stop(t + 0.4); };
    const hit = (t, fr, v, len) => { const s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = nb;
      f.type = fr > 5000 ? 'highpass' : 'bandpass'; f.frequency.value = fr; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
      s.connect(f).connect(g).connect(m); s.start(t, Math.random()); s.stop(t + len + 0.02); };
    const bass = (n, t, len) => { const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = hz(n - 12);
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.3, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + len); o.connect(g).connect(m); o.start(t); o.stop(t + len + 0.05); };
    let next = ac.currentTime + 0.15, step = 0;
    const sched = () => {
      while (next < ac.currentTime + 0.5) {
        const bar = Math.floor(step / 8) % CH.length, e = step % 8, t = next + (e % 2 ? swing : 0), c = CH[bar];
        if (e === 0) { c.forEach((n, i) => keys(n, t + i * 0.012, beat * 3.6, 0.07)); bass(c[0], t, beat * 1.8); }
        if (e === 5) c.slice(1).forEach((n, i) => keys(n, t + i * 0.01, beat * 1.5, 0.035));
        if (e === 4) bass(c[0] + 7, t, beat);
        if (e === 0 || e === 5) kick(t);
        if (e === 2 || e === 6) hit(t, 1800, 0.2, 0.18);
        hit(t, 8000, e % 2 ? 0.03 : 0.055, 0.05);
        if (Math.random() < (am ? 0.38 : 0.25) && e % 2 === 0) keys(MEL[Math.random() * MEL.length | 0], t, beat * 1.4, am ? 0.05 : 0.045);
        next += beat / 2; step++;
      }
    };
    const timer = setInterval(sched, 100); sched();
    lofi = { ac, m, timer };
  }
  function stopLofi() { if (!lofi) return; const L = lofi; lofi = null; L.m.gain.setTargetAtTime(0, L.ac.currentTime, 0.4); setTimeout(() => { clearInterval(L.timer); L.ac.close(); }, 1500); }
  function toggleLofi() {
    if (lofi) { stopLofi(); lofiBtn.classList.remove('on'); toast('lofi off'); }
    else { startLofi(); lofiBtn.classList.add('on'); toast((morning > 0.4 ? 'morning lofi ♪' : 'lofi on ♪') + (prefs.volume > 0 ? '' : ' — turn up the sound slider to hear it')); }
  }
  lofiBtn.addEventListener('click', toggleLofi);
  const sndLbl = document.getElementById('sndLbl');
  vol.value = prefs.volume;
  vol.addEventListener('input', () => { prefs.volume = +vol.value; save(); applySound(); });

  // ---------- toast ----------
  const toastEl = document.getElementById('toast'); let toastT;
  function toast(m) { toastEl.textContent = m; toastEl.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('show'), 2600); }

  // ---------- render ----------
  function draw(t) {
    cellPri.fill(0);
    const lamp = 1 - day * 0.6;     // how much the warm indoor light shows
    // wall
    ctx.fillStyle = mix('#22170f', '#4a3a30', day * 0.5); ctx.fillRect(0, 0, innerWidth, innerHeight);
    // wainscot panels under the sill
    for (let y = W.y1 + 3; y < rows; y++) for (let x = 0; x < cols; x++) if (x % 12 === 0) put(x, y, '|', '#3a2819', 20);
    for (let x = 0; x < cols; x++) put(x, W.y1 + 3, '_', '#3a2819', 20);

    // outside: sky
    const px0 = ix0 * cw, py0 = iy0 * ch, pw = (ix1 - ix0 + 1) * cw, ph = (iy1 - iy0 + 1) * ch;
    const sky = ctx.createLinearGradient(0, py0, 0, py0 + ph);
    const mo = morning * (prefs.rain === 2 ? 0.5 : 1);
    sky.addColorStop(0, mix(mix('#0b1026', '#76838f', day), '#8ea6cf', mo * 0.75));
    sky.addColorStop(0.6, mix(mix('#262448', '#97a1aa', day), '#f0b2a2', mo * 0.8));
    sky.addColorStop(1, mix(mix('#5a3650', '#b6bcc2', day), '#ffd38f', mo * 0.9));
    ctx.fillStyle = sky; ctx.fillRect(px0, py0, pw, ph);
    if (flash > 0.02) { ctx.fillStyle = `rgba(225, 232, 255, ${flash * 0.55})`; ctx.fillRect(px0, py0, pw, ph); }
    if (mo > 0.02) {      // the morning sun rising behind the city
      const sx = px0 + pw * 0.72, sy = py0 + ph * 0.78, sr = ph * 0.75;
      const sg = ctx.createRadialGradient(sx, sy, 0, sx, sy, sr);
      sg.addColorStop(0, `rgba(255, 236, 170, ${0.75 * mo})`); sg.addColorStop(0.12, `rgba(255, 214, 140, ${0.5 * mo})`); sg.addColorStop(1, 'rgba(255, 190, 140, 0)');
      ctx.save(); ctx.beginPath(); ctx.rect(px0, py0, pw, ph); ctx.clip(); ctx.fillStyle = sg; ctx.fillRect(px0, py0, pw, ph); ctx.restore();
    }
    // buildings (clipped to the window)
    ctx.save(); ctx.beginPath(); ctx.rect(px0, py0, pw, ph); ctx.clip();
    for (const b of buildings) {
      const top = iy1 - b.h + 1;
      ctx.fillStyle = mix(mix('#07080f', '#0f1220', b.tone), '#5e6873', day * 0.9);
      ctx.fillRect(b.x * cw, top * ch, b.w * cw, (iy1 - top + 1) * ch);
      if (b.antenna) { ctx.fillRect((b.x + b.w / 2) * cw, (top - 2) * ch, 2, 2 * ch); if (Math.sin(t * 0.004 + b.x) > 0.6) { ctx.fillStyle = '#ff5a5a'; ctx.fillRect((b.x + b.w / 2) * cw - 1, (top - 2) * ch - 2, 4, 4); } }
      for (const w of b.wins) {
        if (Math.random() < 0.0004) w.on = !w.on;
        const wx = w.x * cw + cw * 0.15, wy = w.y * ch + ch * 0.2;
        // at night lots of windows glow; on a grey rainy day some still have their lights on, just softer
        const lit = day < 0.85 ? w.on : w.on && w.dayOn;
        if (lit) {
          ctx.fillStyle = mix(w.col, '#e9dcc0', day * 0.45); ctx.globalAlpha = 0.9 - day * 0.15; ctx.fillRect(wx, wy, cw * 0.75, ch * 0.6);
          ctx.globalAlpha = 0.18 * (1 - day * 0.6); ctx.fillRect(wx - 3, wy - 3, cw * 0.75 + 6, ch * 0.6 + 6); ctx.globalAlpha = 1;
        } else { ctx.fillStyle = mix('#1a1f30', '#48515b', day); ctx.fillRect(wx, wy, cw * 0.75, ch * 0.6); }
      }
    }
    ctx.restore();
    drawBirds(t);
    // blurry lights through the rain
    for (const k of bokeh) {
      const a = (0.18 + 0.1 * Math.sin(t * 0.0012 + k.ph)) * (1 - day * 0.7);
      const g = ctx.createRadialGradient(k.x, k.y, 0, k.x, k.y, k.r);
      g.addColorStop(0, `rgba(${k.col}, ${a})`); g.addColorStop(1, `rgba(${k.col}, 0)`);
      ctx.fillStyle = g; ctx.fillRect(k.x - k.r, k.y - k.r, k.r * 2, k.r * 2);
    }
    // rain falling outside
    for (const o of outside) if (o.x < (ix1 + 1) * cw && o.x > ix0 * cw) put(Math.floor(o.x / cw), Math.floor(o.y / ch), o.snow ? (o.vy > 1 ? '*' : '.') : prefs.rain === 2 ? '/' : '|', o.snow ? '#f2f6ff' : mix('#3b4a66', '#c9d3dc', day * 0.6), 130);

    // the glass: fog, trails and drops
    drawText(130);     // everything outside the glass first
    const fw = ix1 - ix0 + 1, fh = iy1 - iy0 + 1;
    if (fogCv.width !== fw || fogCv.height !== fh) { fogCv.width = fw; fogCv.height = fh; }
    const img = fogCtx.createImageData(fw, fh), A = 255 * (0.3 + day * 0.12);
    for (let i = 0; i < fog.length; i++) { img.data[i * 4] = 214; img.data[i * 4 + 1] = 224; img.data[i * 4 + 2] = 238; img.data[i * 4 + 3] = fog[i] * A; }
    fogCtx.putImageData(img, 0, 0);
    ctx.save(); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(fogCv, px0, py0, pw, ph);
    ctx.restore();
    cellPri.fill(0);
    for (const tr of trails) put(Math.floor(tr.x / cw), Math.floor(tr.y / ch), tr.life > 0.6 ? ':' : '.', mix('#1a2233', '#cfe2f5', tr.life * 0.55), 200);
    for (const d of drops) put(Math.floor(d.x / cw), Math.floor(d.y / ch), d.snow ? '*' : d.r < 2 ? '.' : d.r < 3 ? ',' : d.r < 4.4 ? 'o' : 'O', d.snow ? '#ffffff' : d.vy > 0 ? '#e6f2ff' : '#bcd3ea', 210);
    // soapy bubbles (with a little rainbow shimmer)
    const FOAM_CH = ['.', 'o', 'O', '°', 'o', '@'], FOAM_COL = ['#f6f9ff', '#ffffff', '#dff0ff', '#ffe0f2', '#e9ffe9'];
    for (let y = iy0; y <= iy1; y++) for (let x = ix0; x <= ix1; x++) {
      const i = (y - iy0) * fw + (x - ix0), f = foam[i]; if (f < 0.08) continue;
      const sd = foamSeed[i], shimmer = Math.sin(t * 0.003 + sd * 40) > 0.85;
      put(x, y, FOAM_CH[Math.min(5, Math.floor(f * 4.5 + sd * 1.5))], shimmer ? FOAM_COL[3 + (sd * 2 | 0)] : FOAM_COL[sd * 3 | 0], 220);
    }
    drawTool();

    // window frame
    const frame = mix('#5a3a26', '#ffb070', lamp * 0.1), frameDk = mix('#3e2618', '#ffb070', lamp * 0.06);
    for (let x = W.x0; x <= W.x1; x++) { put(x, W.y0, '=', frame, 300); put(x, W.y1, '=', frame, 300); put(x, my, '=', frameDk, 300); }
    for (let y = W.y0; y <= W.y1; y++) { for (const x of [W.x0, W.x0 + 1, W.x1 - 1, W.x1]) put(x, y, '#', x === W.x0 || x === W.x1 ? frameDk : frame, 300); put(mx, y, '|', frameDk, 300); }
    if (prefs.clock) drawClock();
    drawLights(t);
    drawSill(t, lamp);
    for (const f of fills) { ctx.fillStyle = f.col; ctx.fillRect(f.x * cw, f.y * ch, cw + 0.5, ch + 0.5); }
    fills.length = 0;
    drawText(1e9);
    drawLightGlow(t);
    // a warm lamp glow over the room at night
    const gl = ctx.createRadialGradient(innerWidth * 0.5, innerHeight * 0.95, 0, innerWidth * 0.5, innerHeight * 0.95, innerWidth * 0.7);
    gl.addColorStop(0, `rgba(255, 170, 90, ${0.12 * lamp})`); gl.addColorStop(1, 'rgba(255, 170, 90, 0)');
    ctx.fillStyle = gl; ctx.fillRect(0, 0, innerWidth, innerHeight);
    if (paused) { ctx.fillStyle = 'rgba(255, 240, 220, .8)'; const m = '[ paused ]'; ctx.fillText(m, innerWidth / 2 - ctx.measureText(m).width / 2, innerHeight * 0.8); }
    if (rainGain) { rainGain.gain.value = [0.08, 0.16, 0.28, 0][prefs.rain]; windGain.gain.value = prefs.rain === 3 ? 0.18 : 0; }
  }
  function drawText() {
    const buckets = new Map();
    for (let i = 0; i < cellPri.length; i++) { if (cellPri[i] <= 0) continue; let b = buckets.get(cellCol[i]); if (!b) buckets.set(cellCol[i], b = []); b.push(i); }
    for (const [col, arr] of buckets) { ctx.fillStyle = col; for (const i of arr) ctx.fillText(cellCh[i], (i % cols) * cw, Math.floor(i / cols) * ch); }
  }

  // ---------- loop ----------
  let paused = false, clock = 0, last = 0;
  function frame(now) {
    const dt = Math.min(50, now - last); last = now;
    if (!paused) { clock += dt; updateRain(); updateSill(clock); }
    if (Math.floor(now / 30000) !== Math.floor((now - dt) / 30000)) { day = daylight(); morning = morningness(); }
    draw(clock);
    requestAnimationFrame(frame);
  }
  resize(); addEventListener('resize', resize);
  requestAnimationFrame(frame);

  // ---------- input ----------
  let dragging = false, lastP = null;
  canvas.addEventListener('pointerdown', e => {
    if (prefs.volume > 0) applySound();
    const x = e.clientX, y = e.clientY;
    const c = catPos(), m = mugPos();
    if (hitArt(x, y, c, 17, 5)) {
      setCat('awake'); sfx.meow(); setTimeout(() => sfx.purr(true), 500); setTimeout(() => sfx.purr(false), 3200);
      toast(['meow!', 'purrr…', 'the cat stretches', 'mrrp?'][Math.random() * 4 | 0]); return;
    }
    if (hitArt(x, y, m, 11, 5)) {
      if (sips < 6) { sips++; sfx.sip(); for (let k = 0; k < 6; k++) steam.push({ x: (m.x + 4 + rnd(0, 3)) * cw, y: (m.y - 0.5) * ch, life: 0, max: rnd(40, 70), w: Math.random() * 10 }); toast(sips < 6 ? ['mmm… cozy', 'warm and sweet', 'just right', 'one more sip'][Math.random() * 4 | 0] : 'all gone! tap again for a refill'); }
      else { sips = 0; sfx.sip(); toast('fresh coffee, refilled'); }
      return;
    }
    const bird = birdAt(x, y);
    if (bird) { shooBird(bird); toast('tweet!'); return; }
    if (inGlass(x, y)) { dragging = true; lastP = { x, y }; useTool(x, y, 0); canvas.setPointerCapture(e.pointerId); }
  });
  canvas.addEventListener('pointermove', e => {
    const x = e.clientX, y = e.clientY;
    hover = { x, y };
    canvas.style.cursor = inGlass(x, y) ? (tool === 'finger' ? 'grab' : 'none') : (hitArt(x, y, catPos(), 17, 5) || hitArt(x, y, mugPos(), 11, 5)) ? 'pointer' : '';
    if (!dragging) return;
    const dist = Math.hypot(x - lastP.x, y - lastP.y), steps = Math.ceil(dist / 5);
    for (let k = 1; k <= steps; k++) useTool(lastP.x + (x - lastP.x) * k / steps, lastP.y + (y - lastP.y) * k / steps, dist, k === steps);
    lastP = { x, y };
  });
  const end = () => { dragging = false; lastP = null; };
  canvas.addEventListener('pointerleave', () => { hover = null; });
  let lastSound = 0;
  function useTool(x, y, speed, withSound = true) {
    if (!inGlass(x, y + (tool === 'squeegee' ? ch : 0))) return;
    if (tool === 'finger') wipe(x, y);
    else if (tool === 'sponge') sponge(x, y);
    else squeegee(x, y);
    const now = performance.now();
    if (!withSound || now - lastSound < (tool === 'squeegee' ? 45 : 70)) return;
    lastSound = now;
    if (tool === 'finger') { if (Math.random() < 0.3) sfx.squeak(); }
    else if (tool === 'sponge') sfx.squish(speed);
    else { sfx.swipe(speed, Math.min(1, cleaned / 6)); cleaned = 0; }
  }
  canvas.addEventListener('pointerup', end); canvas.addEventListener('pointercancel', end);

  const wBtns = [...document.querySelectorAll('#weather button')];
  function setRain(l, quiet) {
    prefs.rain = l; save();
    wBtns.forEach(b => b.classList.toggle('on', +b.dataset.w === l));
    if (!quiet) toast(['a gentle drizzle', 'rainy evening', 'a thunderstorm rolls in', 'it started to snow'][l]);
    if (l === 2) nextFlash = 120;
  }
  wBtns.forEach(b => b.addEventListener('click', () => setRain(+b.dataset.w)));
  setRain(prefs.rain, true);
  applySound();
  let lastVol = prefs.volume || 0.6;
  addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (k === 'r') setRain((prefs.rain + 1) % 4);
    else if (k === 'm') { if (prefs.volume > 0) { lastVol = prefs.volume; prefs.volume = 0; } else prefs.volume = lastVol; vol.value = prefs.volume; save(); applySound(); toast(prefs.volume > 0 ? 'sound on' : 'sound off'); }
    else if (k === 'l') toggleLofi();
    else if (k === '1') setTool('finger');
    else if (k === '2') setTool('sponge');
    else if (k === '3') setTool('squeegee');
    else if (k === 'c') { prefs.clock = !prefs.clock; save(); }
    else if (k === 'h') { prefs.h24 = !prefs.h24; save(); }
    else if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  });
  setTimeout(() => document.getElementById('help').style.opacity = '0.35', 9000);
})();
</script>
</body>
</html>
